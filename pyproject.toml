[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-video-agent"
version = "0.1.0"
description = "Agent-driven CS explainer video pipeline (Manim CE + FFmpeg, Scene-IR based)"
requires-python = ">=3.12"
dependencies = ["manim==0.22.0", "pydantic>=2.8,<3", "srt>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3.2"]

[tool.setuptools]
packages = { find = { include = ["cs_video_agent*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
